services:
  backend:
    build: ./backend
    container_name: viperv2-backend
    # Secrets (JWT_SECRET, NVD_API_KEY) come from backend/.env — see backend/.env.example.
    # There is deliberately no fallback secret: the backend refuses to start without one.
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/data/viperv2.db
    volumes:
      - viperv2-db:/app/data
    # Published on localhost only: the API is not reachable from other machines.
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: viperv2-frontend
    # nginx serves the React build and proxies /api and /ws to the backend service
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  viperv2-db:
