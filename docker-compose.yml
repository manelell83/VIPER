version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: viperv2-backend
    ports:
      - "8001:8001"
    volumes:
      - viperv2-db:/app/data
    # Secrets (JWT_SECRET, NVD_API_KEY) come from backend/.env — see backend/.env.example.
    # There is deliberately no fallback secret: the backend refuses to start without one.
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/data/viperv2.db
    # Required for ARP scanning and raw sockets on Linux
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: viperv2-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  viperv2-db:
