<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/viper.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="V.I.P.E.R. — network vulnerability analysis and risk-based prioritization." />
    <meta name="theme-color" content="#0b0b0e" />
    <title>VIPER — Vulnerability analysis &amp; risk prioritization</title>
    <script>
      // Apply dark mode immediately to prevent flash
      const stored = localStorage.getItem("theme");
      if (stored === "light") {
        document.documentElement.classList.remove("dark");
      } else {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
